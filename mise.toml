# mise.toml — archwright tool management
# Bootstrap on a fresh machine: install mise (winget install jdx.mise | brew install mise),
# then: mise trust && mise install && mise run setup && mise run rehydrate-alloy
# See AGENTS.md "Dependency Rehydration".

[tools]
python = "3.12"
uv = "latest"
java = "temurin-21"
node = "22"
"npm:state-machine-cat" = "latest"  # smcat — FSM rendering (PNG additionally needs Graphviz `dot`)
# merman-cli intentionally NOT managed here: cargo backend would pull a full Rust
# toolchain for an optional renderer. Manual: `cargo install merman-cli`.

[env]
# Auto-create and activate a project venv — uv pip installs land here.
# Bypasses pip's require-virtualenv config entirely (uv ignores pip config).
_.python.venv = { path = ".venv", create = true }
# ★/— glyphs break on cp1252 consoles without this (.memory/lessons/utf8-encoding-explicit.md)
PYTHONIOENCODING = "utf-8"
# Python UTF-8 mode (PEP 686): open() defaults to UTF-8 instead of the system
# locale (cp1252 on Windows). Without this, inline python3 -c "json.load(open(...))"
# in the test suite misreads ★/— glyphs written as UTF-8 by the tools.
PYTHONUTF8 = "1"
# archwright-check.py honors this override (upstream 410623c); keeps behavior
# checks working regardless of checkout path.
ARCHWRIGHT_ALLOY_JAR = "{{config_root}}/.references/alloy6.jar"

[tasks.setup]
description = "Install Python dependencies into the project venv (one-time after mise install)"
run = "uv pip install pyyaml hypothesis"

[tasks.doctor]
description = "Check all dependencies and report capability gaps"
run = "python tools/doctor.py"

[tasks.rehydrate-alloy]
description = "Fetch Alloy 6.2.0 dist jar into .references/ with SHA-256 verification (exec CLI needs >= 6.2.0)"
run = "python {{config_root}}/tools/install-alloy.py"

[tasks.validate]
description = "Schema-validate patterns/specs: mise run validate -- <files...>"
run = "python tools/archwright-validate.py"

[tasks."validate:tickets"]
description = "Ticket corpus contract + decay check (tkt from crew-research; falls back to PYTHONPATH invocation)"
run = """
if command -v tkt >/dev/null; then tkt validate > /dev/null && echo "tickets valid"; \
else PYTHONPATH="$HOME/code/crew-research/tools/tkt" python3 -m tkt.cli validate > /dev/null && echo "tickets valid"; fi
"""

[tasks.ship]
description = "Commit staged changes + push if upstream is clean: mise run ship -- \"message\""
run = "bash tools/ship.sh"

[tasks.validate-links]
description = "Link-graph validation: mise run validate-links -- <design-dir>"
run = "python tools/archwright-validate.py --links"

[tasks.check-static]
description = "Batch static check: mise run check-static -- <specs-dir> [--target <root>]"
run = "python tools/archwright-check.py --static"

[tasks.report]
description = "Generate report for a target project: mise run report -- --project <path> [--out <dir>]"
run = """
#!/usr/bin/env bash
set -euo pipefail
PROJECT=""
OUT=""
NAME=""
while [[ $# -gt 0 ]]; do
  case $1 in
    --project) PROJECT="$2"; shift 2 ;;
    --out) OUT="$2"; shift 2 ;;
    --name) NAME="$2"; shift 2 ;;
    *) echo "Unknown arg: $1"; exit 2 ;;
  esac
done
if [ -z "$PROJECT" ]; then echo "Usage: mise run report -- --project <path> [--out <dir>] [--name <display>]"; exit 2; fi
SPECS="$PROJECT/design/specs"
DESIGN="$PROJECT/design"
if [ -z "$OUT" ]; then OUT="$PROJECT/.scratch/report"; fi
if [ -z "$NAME" ]; then NAME="$(basename "$PROJECT")"; fi
mkdir -p "$OUT"
TMP=$(mktemp)
python tools/archwright-check.py --all "$SPECS" --target "$PROJECT" --json > "$TMP" 2>/dev/null || true
python tools/report/generate.py --check-json "$TMP" --design "$DESIGN" --project "$NAME" --out "$OUT"
rm -f "$TMP"
echo "Report: $OUT/report.html"
"""

[tasks.report-publish]
description = "Generate report + commit + push to target project: mise run report-publish -- --project <path> [--name <display>] [--verify]"
run = """
#!/usr/bin/env bash
set -euo pipefail
PROJECT=""
NAME=""
VERIFY=0
while [[ $# -gt 0 ]]; do
  case $1 in
    --project) PROJECT="$2"; shift 2 ;;
    --name) NAME="$2"; shift 2 ;;
    --verify) VERIFY=1; shift ;;
    *) echo "Unknown arg: $1"; exit 2 ;;
  esac
done
if [ -z "$PROJECT" ]; then echo "Usage: mise run report-publish -- --project <path> [--name <display>] [--verify]"; exit 2; fi
DESIGN="$PROJECT/design"
OUT="$DESIGN/report"
SPECS="$DESIGN/specs"
if [ -z "$NAME" ]; then NAME="$(basename "$PROJECT")"; fi
# Generate
mkdir -p "$OUT"
TMP=$(mktemp)
python tools/archwright-check.py --all "$SPECS" --target "$PROJECT" --json > "$TMP" 2>/dev/null || true
python tools/report/generate.py --check-json "$TMP" --design "$DESIGN" --project "$NAME" --out "$OUT"
rm -f "$TMP"
# Verify (optional — Playwright smoke assertions)
if [ "$VERIFY" -eq 1 ]; then
  CHECKER="$(dirname "$0")/../tools/report/playwright-check.js"
  # Graceful skip if playwright not installed
  if ! node -e "require('playwright')" >/dev/null 2>&1; then
    echo "WARN: --verify requested but playwright not installed — skipping (npm install && npx playwright install chromium)"
  else
    echo "Running Playwright verification..."
    REPORT_JSON="$OUT/report.json"
    VERIFY_ARGS="$OUT/report.html"
    if [ -f "$REPORT_JSON" ]; then VERIFY_ARGS="$VERIFY_ARGS --report-json $REPORT_JSON"; fi
    if node tools/report/playwright-check.js $VERIFY_ARGS; then
      echo "Verification: PASS"
    else
      echo "Verification: FAIL (report still written — assertions failed)"
      # Don't exit 1 here — report is still valid, just flagged
    fi
  fi
fi
# Commit + push in the target project
cd "$PROJECT"
git add design/report/
if git diff --cached --quiet; then
  echo "No changes to commit."
else
  git commit -m "chore: regenerate archwright report"
  git push
  echo "Report published to $(git remote get-url origin)"
fi
"""

[tasks.test]
description = "Fixture suite over tests/fixtures/ + examples/ lifecycle corpora — the repo's regression net (count: AGENTS.md test row)"
run = "bash tools/run-fixture-tests.sh"

[tasks.deploy-skills]
description = "Sync skills + steering + overlays to agent tools (kiro copies are symlinks — needed only for NEW skills, regenerated references, or other tools)"
run = "bash tools/deploy-skills.sh"

[tasks.sanitize-check]
description = "Grep tracked files for real target-project names (.sanitization-denylist, gitignored; SKIP if absent)"
run = """
#!/usr/bin/env bash
set -euo pipefail
LIST="{{config_root}}/.sanitization-denylist"
if [ ! -f "$LIST" ]; then
  echo "SKIP: no .sanitization-denylist on this machine — create it from the recall-held alias map (one term per line, # comments ok)"
  exit 0
fi
HITS=0
while IFS= read -r term; do
  term="${term%%#*}"; term="$(echo "$term" | xargs)"
  [ -z "$term" ] && continue
  if git grep -I -i -n --untracked "$term" -- ':!.sanitization-denylist' ; then
    HITS=1
  fi
done < "$LIST"
if [ "$HITS" -eq 1 ]; then
  echo "FAIL: denylisted names in the tree (above) — alias at the source per AGENTS.md sanitization convention"
  exit 1
fi
echo "PASS: no denylisted names in tracked/untracked files"
"""
