<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 1120" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a52"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C08A3E"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B6A8A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="660" height="1120" fill="#FBFAF7"/>

  <!-- Title -->
  <text x="330" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2E2A33">The Compilation</text>
  <text x="330" y="74" text-anchor="middle" font-size="17" fill="#7A756E">forces → resolved pattern → architecture</text>

  <!-- Force poles -->
  <rect x="35" y="100" width="270" height="112" rx="12" fill="#FBEFE0" stroke="#E0A55E" stroke-width="2"/>
  <text x="170" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#8A5A1E">DESIRES</text>
  <text x="170" y="162" text-anchor="middle" font-size="16" fill="#8A5A1E">attractive forces</text>
  <text x="170" y="186" text-anchor="middle" font-size="15" fill="#A97C42">what it wants to become</text>

  <rect x="355" y="100" width="270" height="112" rx="12" fill="#E9EEF2" stroke="#6B8BA4" stroke-width="2"/>
  <text x="490" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#2E4A5E">CONSTRAINTS</text>
  <text x="490" y="162" text-anchor="middle" font-size="16" fill="#2E4A5E">bounding forces</text>
  <text x="490" y="186" text-anchor="middle" font-size="15" fill="#5A7488">hard · soft</text>

  <!-- converge arrows -->
  <path d="M170,212 C170,240 300,238 322,262" fill="none" stroke="#4a4a52" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M490,212 C490,240 360,238 338,262" fill="none" stroke="#4a4a52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tension lens -->
  <polygon points="330,258 460,300 330,342 200,300" fill="#F4ECF0" stroke="#9B6A8A" stroke-width="2"/>
  <text x="330" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#6E4560">TENSION</text>
  <text x="330" y="318" text-anchor="middle" font-size="14" fill="#8A6B80">the named conflict</text>

  <!-- arrow to pattern -->
  <path d="M330,342 L330,382" fill="none" stroke="#4a4a52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pattern card -->
  <rect x="35" y="388" width="590" height="212" rx="14" fill="#2E2A33"/>
  <text x="60" y="424" font-family="Georgia, serif" font-size="22" fill="#F3EFE8">PATTERN</text>
  <rect x="185" y="406" width="118" height="26" rx="13" fill="none" stroke="#6f6a73" stroke-width="1.3"/>
  <text x="244" y="424" text-anchor="middle" font-size="14" fill="#C9C4CC">scale · context</text>
  <!-- confidence stars -->
  <text x="600" y="424" text-anchor="end" font-size="20" fill="#E0B84E">★ ★</text>
  <text x="600" y="444" text-anchor="end" font-size="12" fill="#8f8a92">confidence</text>

  <line x1="60" y1="440" x2="600" y2="440" stroke="#48434e" stroke-width="1"/>

  <text x="60" y="474" font-size="17" fill="#EDE8E0">Resolution — a generative rule</text>
  <text x="60" y="497" font-size="14" fill="#A9A3AD">balances the forces; never a fixed template</text>

  <rect x="60" y="520" width="330" height="54" rx="10" fill="#3b3641" stroke="#565059" stroke-width="1"/>
  <text x="75" y="543" font-size="15" fill="#D7D2DA">Consequences</text>
  <text x="75" y="563" font-size="13" fill="#9B95A0">new forces spawned downstream</text>

  <text x="415" y="540" font-size="14" fill="#C9C4CC">hands</text>
  <text x="415" y="560" font-size="14" fill="#C9C4CC">down ↓</text>

  <!-- consequences feedback loop back up to tension -->
  <path d="M60,547 C18,547 18,300 196,300" fill="none" stroke="#9B6A8A" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrowLoop)"/>

  <!-- hands-down arrow -->
  <path d="M330,600 L330,646" fill="none" stroke="#4a4a52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Architecture container -->
  <rect x="35" y="652" width="590" height="404" rx="14" fill="#F2F1ED" stroke="#C9C4BA" stroke-width="1.5"/>
  <text x="330" y="686" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#4a463f">ARCHITECTURE</text>

  <!-- State graph central -->
  <rect x="225" y="708" width="210" height="92" rx="12" fill="#2E4A5E" stroke="#20323f" stroke-width="2"/>
  <text x="330" y="743" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#EAF1F5">STATE GRAPH</text>
  <text x="330" y="768" text-anchor="middle" font-size="14" fill="#B9CEDB">central anchor</text>
  <text x="330" y="787" text-anchor="middle" font-size="13" fill="#9FBACb">states · transitions</text>

  <!-- connectors to supporting pillars -->
  <path d="M270,800 L165,864" fill="none" stroke="#8a857c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M330,800 L330,864" fill="none" stroke="#8a857c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M390,800 L500,864" fill="none" stroke="#8a857c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Data -->
  <rect x="62" y="870" width="170" height="86" rx="11" fill="#FBFAF7" stroke="#B5B0A6" stroke-width="1.5"/>
  <text x="147" y="905" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4a463f">DATA</text>
  <text x="147" y="928" text-anchor="middle" font-size="13" fill="#8A857C">shape of state</text>

  <!-- Interface -->
  <rect x="245" y="870" width="170" height="86" rx="11" fill="#FBFAF7" stroke="#B5B0A6" stroke-width="1.5"/>
  <text x="330" y="905" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4a463f">INTERFACE</text>
  <text x="330" y="928" text-anchor="middle" font-size="13" fill="#8A857C">how forces enter</text>

  <!-- Invariant (keystone, accented) -->
  <rect x="428" y="870" width="170" height="86" rx="11" fill="#FBEFE0" stroke="#C08A3E" stroke-width="2.2"/>
  <text x="513" y="905" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8A5A1E">INVARIANT</text>
  <text x="513" y="928" text-anchor="middle" font-size="13" fill="#A97C42">resolution, held</text>

  <!-- keystone dashed line from pattern to invariant -->
  <path d="M632,494 C650,494 650,860 600,868" fill="none" stroke="#C08A3E" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#arrowDash)"/>
  <text x="648" y="690" text-anchor="middle" font-size="13" fill="#B07E36" transform="rotate(90 648 690)">= compiled resolved force</text>

  <!-- caption -->
  <text x="330" y="1000" text-anchor="middle" font-size="14" fill="#6b665f">Desires + Constraints → resolved Pattern → hands-down →</text>
  <text x="330" y="1022" text-anchor="middle" font-size="14" fill="#6b665f">State · Data · Interface · Invariant</text>
</svg>
