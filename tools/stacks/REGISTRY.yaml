# Stack Adapter Registry
#
# Per-language/engine mechanical components (Extension Protocol, ADR 0008).
# Orthogonal to domain overlays (tools/domains/) — stack = language/engine,
# domain = vocabulary. A TypeScript game backend is web domain + typescript stack.
#
# Adapter kinds (the only three axes — rule-of-two before adding a fourth):
#   trace_emitter   — instruments the target so behavior specs can be trace-checked
#   ast_grammar     — ast-grep grammar availability for structural constraint checks
#   check_patterns  — reusable check-pattern library for the stack's idioms
#
# Status tiers (guarantee-based, reusing confidence vocabulary — COMPUTED, not declared):
#   pending — registered with reason, unproven. Checks needing it SKIP with reason.
#   "★"     — conformance corpus passes (tools/stacks/<stack>/conformance/)
#   "★★"    — corpus wired into run-fixture-tests.sh + measured cost recorded
# Demotion is stepwise (★★→★→pending); `since` history is retained per status change.
#
# Row contract: every adapter carries status, since (history list, newest first),
# and either `evidence` (★/★★: corpus path + measured cost) or `reason` (pending:
# what's missing, what it unblocks).

stacks:
  gdscript:
    detect: ["project.godot", "*.gd"]
    adapters:
      trace_emitter:
        status: pending
        since:
          - {status: pending, date: 2026-07-17, note: "T7 converted (grill Q05) — target project absent from this machine; '~20 lines' claim becomes measured data on first build"}
        reason: "No GDScript target project available. Unblocks: trace validation of behavior specs in Godot projects."
      ast_grammar:
        status: pending
        since:
          - {status: pending, date: 2026-07-17, note: "birth entry"}
        reason: "ast-grep GDScript support unverified. Unblocks: structural constraint checks (grep fallback available meanwhile)."
      check_patterns:
        status: pending
        since:
          - {status: pending, date: 2026-07-17, note: "birth entry"}
        reason: "No pattern library yet. Unblocks: reusable constraint checks for Godot idioms (signals, autoloads, scene tree)."

  python:
    detect: ["pyproject.toml", "setup.py", "requirements.txt", "*.py"]
    adapters:
      trace_emitter:
        status: "★★"
        since:
          - {status: "★★", date: 2026-07-25, note: "Ticket 049 (discord-poc field gap): corpus wired into run-fixture-tests.sh (3 checks — emit, pass-validate, violate-FAIL); suite 152/0/0. Measured cost: recorder 83 lines (~57 code), scenario run 60ms, ~1 line of test integration per recorded event. Research pass: no prior art emits this shape (Hypothesis = code repr, pytest-reportlog = test lifecycle, PyModel = Python source) — thin convention helper confirmed as cheapest correct shape; snapshot-at-record-time + atomic os.replace write from stdlib-documented pitfalls."}
          - {status: pending, date: 2026-07-25, note: "birth entry — discord-poc dp-poc run (2026-07-22) left ~20 behavior specs' trace checks SKIPping for want of this adapter"}
        evidence: "tools/stacks/python/trace_emitter/conformance/ (scenario.py + py-emitter-conformance.yaml); suite section 'Stack Adapter Conformance'. Field target: discord-poc x1-replay-emission sample trace validated end-to-end 2026-07-25."
      ast_grammar:
        status: pending
        since:
          - {status: pending, date: 2026-07-25, note: "birth entry"}
        reason: "ast-grep ships Python support upstream; conformance corpus not yet written. Unblocks: ★ structural constraint checks."
      check_patterns:
        status: pending
        since:
          - {status: pending, date: 2026-07-25, note: "birth entry"}
        reason: "No pattern library yet. Unblocks: reusable constraint checks for Python idioms (import boundaries, bare except, mutable defaults)."

  typescript:
    detect: ["tsconfig.json", "*.ts"]
    adapters:
      trace_emitter:
        status: "★★"
        since:
          - {status: "★★", date: 2026-07-18, note: "C10: corpus wired into run-fixture-tests.sh (3 checks — emit, pass-validate, violate-FAIL); suite 42/0/0. Measured cost: emitter 75 LOC, scenario run 63ms, ~8 lines of test integration per spec. Bonus: rule-4 violating scenario exposed a check-tool defect (translate_predicate had no numeric comparisons — trace guards/invariants using </<=/>/>= passed vacuously; fixed same commit)."}
          - {status: pending, date: 2026-07-17, note: "birth entry — C10 (TileRush run) builds this as the first Extension Protocol adapter with measured cost"}
        evidence: "tools/stacks/typescript/trace_emitter/conformance/ (scenario.ts + ts-emitter-conformance.yaml); suite section 'Stack Adapter Conformance'. Field use: tilerush-demo session/quest lifecycle traces."
      ast_grammar:
        status: pending
        since:
          - {status: pending, date: 2026-07-17, note: "birth entry"}
        reason: "ast-grep ships TS support upstream; conformance corpus not yet written. Unblocks: ★ structural constraint checks."
      check_patterns:
        status: pending
        since:
          - {status: pending, date: 2026-07-17, note: "birth entry"}
        reason: "No pattern library yet. Unblocks: reusable constraint checks for TS idioms (import boundaries, type-only imports)."
