# Spec Schema: Behavior v0.2
# Validates pure YAML behavior specs (statechart definitions).
# These are machine-primary documents compiled to Alloy and XState.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "archwright/spec/behavior/v0.2"
title: "Archwright Behavior Spec"
type: object
required: [kind, id, from_patterns, initial, states]

properties:
  kind:
    type: string
    const: behavior

  id:
    type: string
    pattern: "^[a-z][a-z0-9-]+$"

  from_patterns:
    type: array
    items:
      type: string
      pattern: "^pattern:.+$"
    description: "Patterns that contribute to this behavior."

  confidence:
    type: string
    enum: ["★★", "★", "—"]

  context:
    type: object
    description: "Extended state — typed variables that guards read."
    properties:
      variables:
        type: object
        additionalProperties:
          type: object
          required: [type, initial]
          properties:
            type:
              type: string
              enum: [int, float, bool, string, enum]
            initial: {}
            from_force:
              type: string

  initial:
    type: string
    description: "ID of the initial state."

  states:
    type: object
    additionalProperties:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [atomic, compound, parallel, final]
        on:
          type: object
        states:
          type: object
        invariant:
          type: object
          properties:
            predicate:
              type: string
            confidence:
              type: string
              enum: ["★★", "★", "—"]
            from_force:
              type: string
        from_pattern:
          type: string
        from_force:
          type: string

  invariants:
    type: array
    items:
      type: object
      required: [id, type, predicate, confidence, from_force]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [state, transition, temporal]
        predicate:
          type: string
        confidence:
          type: string
          enum: ["★★", "★", "—"]
        from_force:
          type: string
        from_pattern:
          type: string
        description:
          type: string

  links:
    type: array
    items:
      type: object
      required: [target, type]
      properties:
        target:
          type: string
          pattern: "^(behavior|contract|constraint|dependency|boundary|protocol|pattern):.+$"
        type:
          type: string
