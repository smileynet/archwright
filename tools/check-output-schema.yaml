# Check Output Schema (CK-03 contract)
#
# The document shape emitted by `archwright-check.py --json`,
# `archwright-check.py --trace <spec> <trace> --json` (ticket 016), and
# `archwright-validate.py --json` (CK-21). Authoritative definition —
# consumers: archwright-passup skill (routing), CK-14 SARIF mapping (future).
# Producers MUST NOT add fields without updating this file.
#
# Trace mode notes (scope.mode: trace — producer: check_trace via
# build_trace_document):
# - coverage counts INVARIANTS declared checkable, not specs; a structural
#   failure (protocol/transition/guard — no spec invariant) adds one to
#   `checked` so passed+failed+skipped always sums to checked.
# - violations[] carries at most one entry (trace replay stops at first
#   failure); confidence comes from the violated invariant (spec-level
#   fallback), provenance from the invariant's from_pattern/from_force
#   (falling back to from_patterns[0] / protects_experience).
# - untranslatable invariants/guards (ticket 015) map into skips[]
#   (guard skips carry invariant: null).
# - Without --json, trace mode emits the bespoke replay shape documented in
#   trace-schema.ts (same exit codes).

$schema: "http://json-schema.org/draft-07/schema#"
title: Archwright check output document
type: object
required: [status, scope, violations, coverage, remaining_delta]
properties:
  status:
    enum: [pass, fail, error]   # error (tool fault) takes precedence over fail
  scope:
    type: object
    required: [mode, specs_checked]
    properties:
      mode: {enum: [files, all, static, trace, validate, links]}
      specs_checked: {type: integer}
      target: {type: [string, "null"]}   # --target root, if given
      changed_only: {type: boolean}      # present when --changed-only filtered the run (CK-19)
      base: {type: string}               # the git ref diffed against (default HEAD)
      specs_total: {type: integer}       # specs in scope BEFORE the changed-only filter
      specs_unaffected: {type: integer}  # specs filtered out (no overlap with the diff) — not skips:
                                         # scope selection was explicitly requested and is visible here
  violations:
    type: array
    items:
      type: object
      required: [spec_id, invariant, confidence, severity, escalate, message, suggested_route]
      properties:
        spec_id: {type: string}
        spec_kind: {type: [string, "null"]}   # behavior | constraint | dependency | contract
        spec_path: {type: string}
        invariant: {type: string}
        confidence: {enum: ["★★", "★", "—"]}
        severity: {enum: [error, warning, info]}   # 1:1 derivation of confidence; baselined violations drop to warning (CK-07)
        escalate: {type: boolean}                  # true iff ★★ (C2) — HITL required; UNTOUCHED by baselining (no back door around C2)
        message: {type: string}
        evidence:
          type: array                              # "path:line:text" lines (project-relative POSIX), capped at 100
          items: {type: string}
        fingerprints:
          type: array                              # aw/v1 (R32), aligned 1:1 with evidence[]; sha256(spec_id,
          items: {type: string}                    # invariant, path, normalized content)[:16] + "_<occurrence>".
                                                   # Line numbers never hashed. ≥1 always (locationless fails
                                                   # fingerprint spec+invariant alone).
        baselined:
          type: boolean                            # present only when a baseline file is active (CK-07). true =
                                                   # ALL fingerprints matched .archwright-baseline.json entries;
                                                   # suppressed from status/remaining_delta. Only constraint/
                                                   # dependency violations are suppressible — behavior/trace never.
        from_pattern: {type: [string, "null"]}     # provenance (CK-09)
        from_force: {type: [string, "null"]}
        suggested_route: {enum: [fix-implementation, fix-check, fix-spec]}
        contrast_pair:                             # CK-10 — the primary pass-up payload
          type: object
          properties:
            expected: {type: string}               # the rule as the design states it
            actual: {type: string}                 # the finding
  warnings:                                        # validate.py only (non-fatal WARNs)
    type: array
    items: {type: object}
  errors:                                          # tool faults (broken check, parse failure)
    type: array
    items:
      type: object
      properties:
        spec_id: {type: [string, "null"]}
        spec_path: {type: string}
        message: {type: string}
        suggested_route: {const: fix-check}
  skips:                                           # check.py only (tickets 012/015/016) — SKIP-with-
    type: array                                    # reason, never silent: pending adapters, vacuous
    items:                                         # absence claims (0 files scanned), backend un-
      type: object                                 # available, untranslatable trace predicates/guards.
      properties:                                  # A skip is a coverage statement, not a pass.
        spec_id: {type: [string, "null"]}
        spec_path: {type: string}
        invariant: {type: [string, "null"]}
        reason: {type: string}
  coverage:
    type: object
    required: [checked, passed, failed, skipped, errors, pending]
    properties:                     # buckets are disjoint: passed+failed+skipped+errors+pending = checked (CK-06)
      checked: {type: integer}
      passed: {type: integer}
      failed: {type: integer}
      skipped: {type: integer}    # adapter/backend unavailable — coverage statement, not a pass
      errors: {type: integer}
      pending: {type: integer}    # target_status: pending specs — neither pass nor fail nor skipped (CK-06); reason still surfaces in skips[]
  fingerprint_algo:
    const: aw/v1                  # version tag for fingerprints[] (R32); algorithm changes bump this —
                                  # a reader seeing an unknown version treats entries as unmatchable
  baseline:                       # present only when .archwright-baseline.json was found/given (CK-07)
    type: object
    properties:
      path: {type: string}
      entries: {type: integer}    # entries in the baseline file
      suppressed: {type: integer} # violations fully matched by the baseline this run
  evidence_ledger:                # present only when the ADR-0009 evidence ledger is active (an
    type: object                  # EXISTING .archwright-evidence.json up-tree, or --evidence <file>)
    properties:                   # and the run wasn't an error (errored runs prove nothing).
      path: {type: string}
      events_appended: {type: integer}  # demotion/promotion candidates appended THIS run (post-dedup).
                                        # Ledger is tool-owned; human ratification happens in the
                                        # artifact (confidence field + Evidence line; ★★ moves are HITL).
  remaining_delta:
    type: integer                 # violations AFTER baseline suppression (CK-07) — what a fix loop
                                  # drives to zero. No baseline active = all violations.
                                  # coverage.failed counts raw outcomes: a fully-baselined spec still
                                  # counts failed (debt stays visible) while status/exit reflect gating.
