# Pattern Schema v0.3
# Validates the YAML frontmatter of a pattern markdown document.
# The markdown body (Problem, Forces, Evidence, Therefore, etc.) is free-form prose.
# Tools extract frontmatter and validate against this schema.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "archwright/pattern/v0.3"
title: "Archwright Pattern (frontmatter)"
type: object
required: [kind, id, name, scale, confidence, status]

properties:
  kind:
    type: string
    const: pattern

  id:
    type: string
    description: "Unique identifier (slug)."
    pattern: "^[a-z][a-z0-9-]+$"

  name:
    type: string
    description: "Human-readable name."

  scale:
    type: string
    enum: [premise, loops-systems, verbs-interactions, feel-finish]
    description: "Which level of the design tower this pattern lives at."

  confidence:
    type: string
    enum: ["★★", "★", "—"]
    description: "★★ = true invariant (mechanical check exists). ★ = believed correct (heuristic check). — = one approach (advisory)."

  status:
    type: string
    enum: [active, fog, deprecated]
    default: active
    description: "active = formalized and checkable. fog = known gap, not yet resolved. deprecated = superseded."

  context:
    type: array
    items:
      type: string
    description: "IDs of larger patterns this one helps complete (upward network links)."

  serves:
    type: array
    items:
      type: string
    description: "IDs of product-level desires this pattern helps satisfy. Patterns without serves links are flagged for review (may be architectural indulgence)."

  completed_by:
    type: array
    items:
      type: string
    description: "IDs of smaller patterns needed to fill this out (downward network links)."

  resolves_into:
    type: array
    items:
      type: string
      pattern: "^(behavior|contract|constraint|dependency|boundary|protocol):.+$"
    description: "kind:id references to specs this pattern produces."

  links:
    type: array
    items:
      type: object
      properties:
        target:
          type: string
        type:
          type: string
          enum: [complements, conflicts-with, alternative-to]
    description: "Same-level sibling relationships."
