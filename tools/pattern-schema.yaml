# Pattern Schema v0.2
# Validates the YAML frontmatter of a pattern markdown document.
# The markdown body (forces, tension, resolution, evidence) is free-form prose.
# Tools extract frontmatter and validate against this schema.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "archwright/pattern/v0.2"
title: "Archwright Pattern (frontmatter)"
type: object
required: [kind, id, name, scale, confidence]

properties:
  kind:
    type: string
    const: pattern

  id:
    type: string
    description: "Unique identifier (slug)."
    pattern: "^[a-z][a-z0-9-]+$"

  name:
    type: string
    description: "Human-readable name."

  scale:
    type: string
    enum: [premise, loops-systems, verbs-interactions, feel-finish]
    description: "Which level of the design tower this pattern lives at."

  confidence:
    type: string
    enum: ["★★", "★", "—"]
    description: "★★ = true invariant. ★ = believed correct. — = one approach."

  above:
    type: array
    items:
      type: string
    description: "IDs of larger patterns this one helps complete."

  resolves_into:
    type: array
    items:
      type: string
      pattern: "^(behavior|contract|constraint|dependency|boundary|protocol):.+$"
    description: "kind:id references to specs this pattern produces."
